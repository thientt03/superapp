services:
  backend:
    build: ./backend
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      CORS_ORIGINS: http://localhost:5173
  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_BASE_URL: http://localhost:8000
    ports:
      - "127.0.0.1:5173:80"
    depends_on:
      - backend
