server {
  listen 80;
  server_tokens off;
  root /usr/share/nginx/html;
  add_header X-Frame-Options "DENY" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  # connect-src phải khớp VITE_API_BASE_URL trong docker-compose.yml
  add_header Content-Security-Policy "default-src 'self'; img-src 'self' https://images.unsplash.com data:; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; connect-src 'self' http://localhost:8000; frame-ancestors 'none'" always;
  location / {
    try_files $uri /index.html;
  }
}
