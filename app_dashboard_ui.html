<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giao Diện Ứng Dụng</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome CDN for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts: Be Vietnam Pro -->
    <link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Be Vietnam Pro', sans-serif;
            background-color: #f3f4f6;
        }
        /* Custom scrollbar hiding for clean UI */
        .no-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .no-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body class="flex justify-center items-center min-h-screen p-0 sm:p-4 bg-slate-100">

    <!-- Mobile Frame Container -->
    <div class="w-full max-w-md bg-[#f8f9fa] min-h-screen sm:min-h-[844px] sm:max-h-[900px] sm:rounded-[36px] shadow-2xl flex flex-col justify-between overflow-hidden relative border border-slate-200">
        
        <!-- Header Background Gradient & User Profile Header -->
        <div class="relative bg-gradient-to-br from-[#c0064f] via-[#9e0540] to-[#7d002f] pt-8 pb-16 px-5 rounded-b-[32px] shadow-md z-0">
            <!-- User Profile & Action Buttons Header -->
            <div class="flex items-center justify-between">
                <!-- User Info Profile Left -->
                <div class="flex items-center gap-3">
                    <div class="relative">
                        <img src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100&auto=format&fit=crop&q=80" alt="Avatar" class="w-11 h-11 rounded-full object-cover border-2 border-white/80 shadow-md">
                        <span class="absolute bottom-0 right-0 w-3 h-3 bg-emerald-400 border-2 border-[#9e0540] rounded-full"></span>
                    </div>
                    <div>
                        <div class="text-xs text-rose-200 font-medium flex items-center gap-1">
                            <span>Chào buổi chiều 👋</span>
                        </div>
                        <h1 class="text-base font-bold text-white tracking-wide">Nguyễn Văn A</h1>
                    </div>
                </div>

                <!-- Right Action Icons: Notification Bell & AI Chatbot -->
                <div class="flex items-center gap-2">
                    <!-- Notification Bell -->
                    <button class="relative w-10 h-10 bg-white/15 hover:bg-white/25 text-white rounded-full flex items-center justify-center transition active:scale-95 border border-white/20">
                        <i class="fa-regular fa-bell text-base text-rose-100"></i>
                        <span class="absolute top-2 right-2 w-2 h-2 bg-rose-400 rounded-full ring-2 ring-[#9e0540]"></span>
                    </button>

                    <!-- Chatbot AI Button -->
                    <button onclick="toggleAiChat()" class="relative w-10 h-10 bg-gradient-to-tr from-amber-400 to-rose-400 hover:from-amber-300 hover:to-rose-300 text-white rounded-full flex items-center justify-center transition-all active:scale-95 shadow-md border border-white/40 group shrink-0">
                        <i class="fa-solid fa-robot text-base text-white group-hover:rotate-12 transition-transform"></i>
                        <!-- Online Glow Status -->
                        <span class="absolute -top-0.5 -right-0.5 w-3 h-3 bg-emerald-400 border-2 border-[#9e0540] rounded-full animate-pulse"></span>
                    </button>
                </div>
            </div>
        </div>

        <!-- Scrollable Main Content -->
        <div class="px-4 -mt-10 flex-1 overflow-y-auto no-scrollbar pb-24 z-10">
            
            <!-- Top Widgets Section -->
            <div class="grid grid-cols-2 gap-3 mb-6">
                <!-- Chấm công Widget -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-7 h-7 rounded-full bg-teal-50 flex items-center justify-center text-teal-600">
                            <i class="fa-regular fa-clock text-xs"></i>
                        </div>
                        <span class="text-xs font-semibold text-slate-600">Chấm công</span>
                    </div>
                    
                    <div class="my-1">
                        <div class="text-2xl font-bold text-slate-800 tracking-tight">14:47</div>
                        <div class="text-[11px] text-slate-400 font-medium">Ca 08:30 · chưa vào</div>
                    </div>

                    <button onclick="handleCheckIn()" class="w-full mt-3 py-2 px-3 bg-[#be094e] hover:bg-[#a00640] text-white rounded-xl text-xs font-semibold flex items-center justify-center gap-2 transition active:scale-95 shadow-sm shadow-rose-200">
                        <i class="fa-solid fa-arrow-right-to-bracket text-xs"></i>
                        <span>Chấm vào</span>
                    </button>
                </div>

                <!-- Lịch họp Quick Status / Ca làm việc Widget -->
                <div class="bg-white p-4 rounded-2xl shadow-sm border border-slate-100 flex flex-col justify-between hover:shadow-md transition">
                    <div class="flex items-center gap-2 mb-2">
                        <div class="w-7 h-7 rounded-full bg-rose-50 flex items-center justify-center text-rose-600">
                            <i class="fa-regular fa-calendar-check text-xs"></i>
                        </div>
                        <span class="text-xs font-semibold text-slate-600">Sự kiện hôm nay</span>
                    </div>

                    <div class="my-1">
                        <div class="text-sm font-bold text-slate-800 line-clamp-1">Họp giao ban tuần</div>
                        <div class="text-[11px] text-slate-400 font-medium">15:30 - Phòng A1</div>
                    </div>

                    <button class="w-full mt-3 py-2 px-3 bg-purple-50 hover:bg-purple-100 text-purple-700 rounded-xl text-xs font-semibold flex items-center justify-between transition active:scale-95">
                        <span>Chi tiết</span>
                        <i class="fa-solid fa-chevron-right text-[10px]"></i>
                    </button>
                </div>
            </div>

            <!-- Apps Grid Section Header -->
            <div class="flex items-center justify-between mb-4 px-1">
                <h2 class="text-base font-bold text-slate-800">Ứng dụng đã ghim</h2>
                <button class="text-xs font-semibold text-[#be094e] hover:underline flex items-center gap-1">
                    <span>Sắp xếp</span>
                </button>
            </div>

            <!-- Pinned Apps Grid (Đã loại bỏ: Mục tiêu, Reward, Inside, Báo lỗi & góp ý, Lịch họp) -->
            <div class="grid grid-cols-4 gap-y-5 gap-x-3 text-center">
                
                <!-- App 1: Công việc -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Công việc')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-teal-600 to-emerald-400 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-regular fa-square-check"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Công việc</span>
                </div>

                <!-- App 2: Đề xuất -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Đề xuất')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-400 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-regular fa-paper-plane"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Đề xuất</span>
                </div>

                <!-- App 3: Tuyển dụng -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Tuyển dụng')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-pink-600 to-rose-400 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-solid fa-user-plus"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Tuyển dụng</span>
                </div>

                <!-- App 4: Hành chính -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Hành chính')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-rose-900 to-red-700 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-solid fa-stamp"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Hành chính</span>
                </div>

                <!-- App 5: Chấm công -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Chấm công')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-cyan-600 to-sky-400 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-regular fa-clock"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Chấm công</span>
                </div>

                <!-- App 6: Hồ sơ -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Hồ sơ')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-purple-600 to-indigo-400 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-regular fa-address-card"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Hồ sơ</span>
                </div>

                <!-- App 7: Tính lương & phúc lợi -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Tính lương & phúc lợi')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-rose-500 to-pink-500 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-solid fa-wallet"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight truncate w-full">Tính lương...</span>
                </div>

                <!-- App 8: Báo cáo -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Báo cáo')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-400 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-solid fa-chart-pie"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Báo cáo</span>
                </div>

                <!-- App 9: Kho -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Kho')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-slate-700 to-indigo-600 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-solid fa-boxes-stacked"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Kho</span>
                </div>

                <!-- App 10: Cài đặt -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Cài đặt')">
                    <div class="w-14 h-14 rounded-2xl bg-gradient-to-tr from-slate-600 to-slate-400 flex items-center justify-center text-white text-xl shadow-md group-hover:scale-105 transition-transform duration-200">
                        <i class="fa-solid fa-gear"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-700 leading-tight">Cài đặt</span>
                </div>

                <!-- Add New Button -->
                <div class="flex flex-col items-center group cursor-pointer" onclick="openApp('Thêm ứng dụng')">
                    <div class="w-14 h-14 rounded-2xl border-2 border-dashed border-rose-300 flex items-center justify-center text-rose-500 text-xl group-hover:bg-rose-50 transition-colors duration-200">
                        <i class="fa-solid fa-plus"></i>
                    </div>
                    <span class="mt-2 text-[11px] font-medium text-slate-400 leading-tight">Thêm mới</span>
                </div>

            </div>
        </div>

        <!-- Toast Notification Area -->
        <div id="toast" class="absolute top-5 left-1/2 -translate-x-1/2 bg-slate-800 text-white px-4 py-2 rounded-full text-xs shadow-lg opacity-0 pointer-events-none transition-opacity duration-300 z-50 flex items-center gap-2">
            <i class="fa-solid fa-circle-check text-green-400"></i>
            <span id="toast-message">Thông báo</span>
        </div>

        <!-- Bottom Navigation Bar (Tabs: Trang chủ, Hồ sơ, Công việc) -->
        <div class="bg-white border-t border-slate-100 py-2 px-6 flex justify-around items-center absolute bottom-0 left-0 right-0 z-10 shadow-lg">
            
            <!-- Tab 1: Trang chủ (Active Tab) -->
            <button class="flex flex-col items-center gap-1 text-[#be094e] font-semibold">
                <div class="px-4 py-1 bg-rose-50 rounded-full flex flex-col items-center">
                    <i class="fa-solid fa-house text-lg"></i>
                </div>
                <span class="text-[10px]">Trang chủ</span>
            </button>

            <!-- Tab 2: Hồ sơ -->
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-regular fa-address-card text-lg"></i>
                <span class="text-[10px] font-medium">Hồ sơ</span>
            </button>

            <!-- Tab 3: Công việc -->
            <button class="flex flex-col items-center gap-1 text-slate-400 hover:text-slate-600 transition">
                <i class="fa-regular fa-square-check text-lg"></i>
                <span class="text-[10px] font-medium">Công việc</span>
            </button>

        </div>

        <!-- AI Assistant Modal Overlay -->
<!-- ... existing code -->
